<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Automation Laboratory Language 四模块架构</title>
  <desc id="desc">Agent 通过 ALL 使用研究对象、工作站绑定操作、工作流和系统四类能力，并由底层物理设备完成执行。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#F5FBF8"/>
    </linearGradient>
    <linearGradient id="protocol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#155EEF"/>
      <stop offset="1" stop-color="#5A76E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#19345E" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58749B"/>
    </marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102A56}
      .subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748B}
      .layer-title{font:700 29px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102A56}
      .layer-sub{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667A98}
      .protocol-title{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:white}
      .protocol-sub{font:500 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#DCE7FF}
      .card-title{font:700 27px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17345E;text-anchor:middle}
      .card-sub{font:500 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5C6F8D;text-anchor:middle}
      .chip{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334B6D;text-anchor:middle}
      .arrow-label{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#65758D;text-anchor:middle}
    </style>
  </defs>

  <rect width="1440" height="960" rx="32" fill="url(#bg)"/>
  <text class="title" x="720" y="62" text-anchor="middle">Automation Laboratory Language（ALL）</text>
  <text class="subtitle" x="720" y="96" text-anchor="middle">面向实验室设备的四模块协议架构</text>

  <g filter="url(#shadow)">
    <rect x="430" y="132" width="580" height="104" rx="26" fill="#FFFFFF" stroke="#B6C5DA" stroke-width="2"/>
  </g>
  <circle cx="492" cy="184" r="31" fill="#EDF3FF"/>
  <path d="M482 192c5-11 15-11 20 0M492 175a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" fill="none" stroke="#326FDC" stroke-width="3" stroke-linecap="round"/>
  <text class="layer-title" x="544" y="180">Agent / 调用方</text>
  <text class="layer-sub" x="544" y="208">理解目标、选择能力、接收结果</text>

  <path d="M720 236V278" fill="none" stroke="#58749B" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="800" y="265">统一协议调用</text>

  <g filter="url(#shadow)">
    <rect x="205" y="294" width="1030" height="104" rx="27" fill="url(#protocol)"/>
  </g>
  <text class="protocol-title" x="720" y="340" text-anchor="middle">ALL 协议入口</text>
  <text class="protocol-sub" x="720" y="372" text-anchor="middle">能力发现 · 结构化请求 · 结构化结果 · 一致错误语义</text>

  <g fill="none" stroke="#58749B" stroke-width="3" marker-end="url(#arrow)">
    <path d="M720 398V430H285V468"/>
    <path d="M720 398V430H575V468"/>
    <path d="M720 398V430H865V468"/>
    <path d="M720 398V430H1155V468"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="145" y="474" width="280" height="264" rx="26" fill="#FFFFFF" stroke="#6CB9A2" stroke-width="2"/>
    <rect x="435" y="474" width="280" height="264" rx="26" fill="#FFFFFF" stroke="#F0A160" stroke-width="2"/>
    <rect x="725" y="474" width="280" height="264" rx="26" fill="#FFFFFF" stroke="#A58ADF" stroke-width="2"/>
    <rect x="1015" y="474" width="280" height="264" rx="26" fill="#FFFFFF" stroke="#6E9EED" stroke-width="2"/>
  </g>

  <g>
    <circle cx="285" cy="532" r="28" fill="#E7F7F1"/>
    <path d="M273 528h24v17h-24zM277 520h16l4 8h-24z" fill="none" stroke="#27997B" stroke-width="2.5" stroke-linejoin="round"/>
    <text class="card-title" x="285" y="586">对象</text>
    <text class="card-sub" x="285" y="614">统一研究对象</text>
    <rect x="177" y="642" width="216" height="38" rx="12" fill="#EBF8F4"/><text class="chip" x="285" y="667">身份 · 样品 · 容器</text>
    <rect x="177" y="690" width="216" height="38" rx="12" fill="#EBF8F4"/><text class="chip" x="285" y="715">证据 · 来源 · 扩展</text>
  </g>

  <g>
    <circle cx="575" cy="532" r="28" fill="#FFF1E6"/>
    <path d="M563 533h24M575 521v24" fill="none" stroke="#E27C2D" stroke-width="3" stroke-linecap="round"/>
    <text class="card-title" x="575" y="586">操作</text>
    <text class="card-sub" x="575" y="614">工作站绑定状态转换</text>
    <rect x="467" y="642" width="216" height="38" rx="12" fill="#FFF3E9"/><text class="chip" x="575" y="667">读取类 · 写入类 · 调用类</text>
    <rect x="467" y="690" width="216" height="38" rx="12" fill="#FFF3E9"/><text class="chip" x="575" y="715">强制约束 · 诊断 · 提交</text>
  </g>

  <g>
    <circle cx="865" cy="532" r="28" fill="#F2ECFE"/>
    <path d="M853 524h24v17h-24zM858 519v10M872 519v10" fill="none" stroke="#7757BE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="865" y="586">Workflow</text>
    <text class="card-sub" x="865" y="614">组织多个操作</text>
    <rect x="757" y="642" width="216" height="38" rx="12" fill="#F4EFFE"/><text class="chip" x="865" y="667">顺序 · 循环 · 分支</text>
    <rect x="757" y="690" width="216" height="38" rx="12" fill="#F4EFFE"/><text class="chip" x="865" y="715">并行 · 保护 · 版本</text>
  </g>

  <g>
    <circle cx="1155" cy="532" r="28" fill="#EAF2FF"/>
    <circle cx="1155" cy="532" r="10" fill="none" stroke="#326FDC" stroke-width="2.5"/>
    <path d="M1155 515v5M1155 544v5M1138 532h5M1167 532h5" fill="none" stroke="#326FDC" stroke-width="2.5" stroke-linecap="round"/>
    <text class="card-title" x="1155" y="586">系统</text>
    <text class="card-sub" x="1155" y="614">协议公共能力</text>
    <rect x="1047" y="642" width="216" height="38" rx="12" fill="#EEF4FF"/><text class="chip" x="1155" y="667">发现 · 状态 · 事件</text>
    <rect x="1047" y="690" width="216" height="38" rx="12" fill="#EEF4FF"/><text class="chip" x="1155" y="715">权限 · 安全 · 审计</text>
  </g>

  <g fill="none" stroke="#7E91AD" stroke-width="3" marker-end="url(#arrow)">
    <path d="M285 738V786"/>
    <path d="M575 738V786"/>
    <path d="M865 738V786"/>
    <path d="M1155 738V786"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="145" y="800" width="1150" height="92" rx="25" fill="#17345E"/>
  </g>
  <text x="720" y="846" text-anchor="middle" style="font:700 29px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:white">物理设备</text>
  <text x="720" y="875" text-anchor="middle" style="font:500 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#D7E2F2">执行操作 · 产生状态 · 返回结果</text>

</svg>
